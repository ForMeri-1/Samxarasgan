<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentines Day</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .gradient-background {
      background: linear-gradient(180deg, rgba(255, 208, 229, 1) 0%, rgba(255, 232, 242, 1) 36%, rgba(255, 255, 255, 1) 100%);
    }

    .bounce2 {
      animation: bounce2 2s ease infinite;
    }

    @keyframes bounce2 {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
      60% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>
<body class="gradient-background flex items-center justify-center min-h-screen px-6">
  <div class="flex flex-col items-center p-4 max-w-sm w-full">
    <img id="imageDisplay" src="./images/image1.gif" alt="Cute kitten with flowers" class="rounded-md max-w-full h-auto" />
    <h2 id="valentineQuestion" class="text-2xl md:text-4xl font-bold italic text-[#bd1e59] my-4 text-center">Will you be my Valentine?</h2>
    <div class="flex gap-4 pt-4 items-center" id="responseButtons">
      <button id="yesButton" class="bounce2 text-lg md:text-xl font-medium rounded-md min-h-12 min-w-[75px] max-w-[200px] px-4 py-2 bg-green-500 text-white hover:bg-green-400 transition">
        Yes
      </button>
      <button id="noButton" class="text-lg md:text-xl font-medium rounded-md min-h-12 min-w-[75px] max-w-[200px] px-4 py-2 bg-red-500 text-white hover:bg-red-700 transition">
        No
      </button>
    </div>
  </div>

  <script type="module">
    import confetti from 'https://cdn.skypack.dev/canvas-confetti';
    const yesButton = document.getElementById('yesButton');
    const noButton = document.getElementById('noButton');
    const imageDisplay = document.getElementById('imageDisplay');
    const valentineQuestion = document.getElementById('valentineQuestion');
    const responseButtons = document.getElementById('responseButtons');
    
    let noClickCount = 0;
    let buttonSize = 75; // Starting button size
    let fontSize = 20; // Starting font size
    
    const imagePaths = [
      "./images/image1.gif",
      "./images/image2.gif",
      "./images/image5.gif",
      "./images/image4.gif",
      "./images/image5.gif",
      "./images/image6.gif",
      "./images/image7.gif"
    ];
    
    noButton.addEventListener('click', function() {
      if (noClickCount < 5) {
        noClickCount++;
        imageDisplay.src = imagePaths[noClickCount];
        buttonSize += 20; // Increase size gradually
        fontSize += 5;
        yesButton.style.minWidth = `${buttonSize}px`;
        yesButton.style.minHeight = `${buttonSize}px`;
        yesButton.style.fontSize = `${fontSize}px`;
        
        if (noClickCount < 6) {
          noButton.textContent = ["არა", "სწორ გადაწყვეტილებას იღებ?", "რასმიკეთებ", "არანაირად", "მისამართი ვიცი :))", "ეგახართ ქალები"][noClickCount];
        }
      }
    });
    
    yesButton.addEventListener('click', () => {
      imageDisplay.src = './images/image3.gif';
      valentineQuestion.textContent = "World Cup-იც მოვიგე";
      responseButtons.style.display = 'none';
      confetti();
    });
  </script>
</body>
</html>
